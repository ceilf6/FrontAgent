name: Repo Guard

# PR 用 pull_request_target 而非 pull_request:白名单里的外部贡献者从 fork 提 PR 时,
# pull_request 会卡在首次贡献者批准、且只发只读 token(评审无法发布)。
# target 事件安全的前提:本 workflow 从不执行 PR 代码——运行时来自 ceilf6/repo-guard@main,
# checkout 的 PR head(固定 sha)仅作只读评审数据,且 job 级 if 门禁来自 base 分支、PR 改不了。
on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  guard:
    # 除仓库成员外,显式加白的触发人(NanluQingshi / HaveNiceDa)也可触发评审,
    # 含他们从 fork 提交的 PR;fork checkout 仅作为只读评审数据,不执行其代码。
    if: >
      github.actor != 'dependabot[bot]' &&
      (
        (
          github.event_name == 'pull_request_target' &&
          (
            github.event.pull_request.head.repo.full_name == github.repository ||
            contains(fromJSON('["NanluQingshi","HaveNiceDa"]'), github.event.pull_request.user.login)
          )
        ) ||
        (
          github.event_name == 'issues' &&
          (
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) ||
            contains(fromJSON('["NanluQingshi","HaveNiceDa"]'), github.event.issue.user.login)
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          (
            contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
            contains(fromJSON('["NanluQingshi","HaveNiceDa"]'), github.event.comment.user.login)
          )
        )
      )
    # REPO_GUARD_RUNNER 指向自托管 runner(如 repo-guard-claude)时,
    # REPO_GUARD_ENGINE=claude-code 在 runner 本机跑 Claude Code CLI 评审。
    runs-on: ${{ vars.REPO_GUARD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      # PR 评审的工作目录:checkout 即评审数据,凭据不落盘。
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request_target' || (github.event_name == 'issue_comment' && github.event.issue.pull_request)
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || format('refs/pull/{0}/head', github.event.issue.number) }}
          persist-credentials: false
      - uses: ceilf6/repo-guard@main
        with:
          type: both
          engine: ${{ vars.REPO_GUARD_ENGINE || 'api' }}
          claude-model: ${{ vars.CLAUDE_CODE_MODEL }}
          provider: ${{ vars.LLM_PROVIDER }}
          model: ${{ vars.LLM_MODEL }}
          api-key: ${{ secrets.LLM_API_KEY }}
          base-url: ${{ vars.LLM_BASE_URL }}
          provider-order: ${{ vars.LLM_PROVIDER_ORDER }}
